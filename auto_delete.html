<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge - Auto Delete Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body {
            background: linear-gradient(135deg, #FFF7D6 0%, #FFF2B2 100%);
            margin: 0; padding: 20px 15px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: #FFFFFF; padding: 28px; border-radius: 28px;
            box-shadow: 0 12px 32px rgba(127, 168, 214, 0.25);
            max-width: 500px; width: 100%; text-align: center;
        }
        h2 { color: #4A5568; margin-top: 0; margin-bottom: 10px; }
        p.sub { color: #718096; font-size: 14px; margin-bottom: 20px; }
        
        .scanner-box {
            background: #F7FAFC; border: 2px dashed #CBD5E0;
            border-radius: 20px; padding: 25px 15px; margin-bottom: 20px;
        }

        .btn {
            background: #4299E1; color: white; border: none; padding: 12px 24px;
            border-radius: 14px; font-size: 16px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
            width: 100%; margin-top: 10px;
        }
        .btn:hover { background: #3182CE; }
        .btn-danger { background: #E53E3E; box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3); }
        .btn-danger:hover { background: #C53030; }

        .status-badge {
            margin-top: 15px; padding: 12px; border-radius: 16px;
            font-size: 15px; font-weight: 500; transition: all 0.3s;
        }
        .status-normal { background: #E2E8F0; color: #4A5568; }
        .status-counting { background: #FEEBC8; color: #742A2A; animation: pulse 1s infinite; }
        .status-success { background: #48BB78; color: #FFFFFF; font-weight: 600; font-size: 17px; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .log-box {
            margin-top: 15px; background: #FAFBFD; border: 1px solid #E2E8F0;
            border-radius: 12px; padding: 10px; max-height: 120px; overflow-y: auto;
            font-size: 13px; text-align: left; color: #4A5568;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 จำลองระบบสแกน & ลบสินค้าอัตโนมัติ</h2>
    <p class="sub">ระบบจัดการตู้เย็นอัจฉริยะ (Smart Fridge)</p>
    
    <div class="scanner-box">
        <p style="margin: 0 0 10px 0; color: #2D3748; font-weight: 500;">จำลองสถานการณ์นำขวดน้ำ/สินค้าออกจากตู้เย็น:</p>
        <button class="btn" id="simulateBtn">📥 วัตถุอยู่ในตู้เย็น (พร้อมสแกน)</button>
        <button class="btn btn-danger" id="removeBtn" style="display:none;">📤 หยิบสินค้าออกจากตู้เย็น (เริ่มนับถอยหลัง)</button>
    </div>

    <div id="statusBadge" class="status-badge status-normal">
        🟢 ระบบพร้อมทำงาน กดปุ่มจำลองด้านบนได้เลย
    </div>

    <div class="log-box" id="logBox">
        <div>📌 ระบบเริ่มต้นสำเร็จ พร้อมเชื่อมต่อ Firebase</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByrRWviTEVOggThiJMJXsSwfpZ68-IxnU",
        authDomain: "smart-fridge-ce1ed.firebaseapp.com",
        projectId: "smart-fridge-ce1ed",
        storageBucket: "smart-fridge-ce1ed.firebasestorage.app",
        messagingSenderId: "280582221295",
        appId: "1:280582221295:web:35b52f447a7a7454d75a1a",
        measurementId: "G-M4410HZBQJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const simulateBtn = document.getElementById('simulateBtn');
    const removeBtn = document.getElementById('removeBtn');
    const statusBadge = document.getElementById('statusBadge');
    const logBox = document.getElementById('logBox');

    let countdownTimer = null;
    let intervalTimer = null;

    function addLog(msg) {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // ฟังก์ชันลบข้อมูลจาก Firebase
    async function deleteItemFromFirestore() {
        try {
            const q = query(collection(db, "food_items"));
            const querySnapshot = await getDocs(q);

            let itemName = "ขวดน้ำ (bottle)";

            if (!querySnapshot.empty) {
                const firstDoc = querySnapshot.docs[0];
                itemName = firstDoc.data().name || itemName;
                await deleteDoc(doc(db, "food_items", firstDoc.id));
            }

            statusBadge.className = "status-badge status-success";
            statusBadge.innerText = `✅ ลบผลิตภัณฑ์สำเร็จ! (${itemName})`;
            addLog(`🔥 ลบผลิตภัณฑ์ "${itemName}" ออกจาก Firebase สำเร็จเรียบร้อย`);

            simulateBtn.style.display = 'block';
            removeBtn.style.display = 'none';

        } catch (err) {
            console.error("Error deleting document:", err);
            statusBadge.className = "status-badge status-normal";
            statusBadge.innerText = "❌ เกิดข้อผิดพลาดในการลบข้อมูล";
        }
    }

    // คลิกจำลองว่านำสินค้ามาวางในตู้
    simulateBtn.addEventListener('click', () => {
        if (countdownTimer) clearTimeout(countdownTimer);
        if (intervalTimer) clearInterval(intervalTimer);

        statusBadge.className = "status-badge status-normal";
        statusBadge.innerText = "📦 ตรวจพบสินค้าในตู้เย็นแล้ว (พร้อมหยิบออก)";
        addLog("📦 ตรวจพบสินค้าอยู่ในตู้เย็น");
        
        simulateBtn.style.display = 'none';
        removeBtn.style.display = 'block';
    });

    // คลิกจำลองว่าหยิบสินค้าออกจากตู้ (เริ่มนับถอยหลัง 5 วิเพื่อลบ)
    removeBtn.addEventListener('click', () => {
        addLog("⚠️ หยิบสินค้าออกจากตู้เย็น! เริ่มนับถอยหลัง 5 วินาที...");
        
        let timeLeft = 5;
        statusBadge.className = "status-badge status-counting";
        statusBadge.innerText = `⏳ วัตถุหายไป! จะลบสินค้าใน ${timeLeft} วินาที`;

        intervalTimer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusBadge.innerText = `⏳ วัตถุหายไป! จะลบสินค้าใน ${timeLeft} วินาที`;
            }
        }, 1000);

        countdownTimer = setTimeout(() => {
            clearInterval(intervalTimer);
            deleteItemFromFirestore();
        }, 5000);
    });
</script>

</body>
</html>
